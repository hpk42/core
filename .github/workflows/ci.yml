# GitHub Actions workflow to
# lint Rust and Python code
# and run Rust tests, Python tests and async Python tests.

name: Rust CI

# Cancel previously started workflow runs
# when the branch is updated.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "17 1 * * *"

permissions: {}

env:
  RUSTFLAGS: -Dwarnings
  RUST_VERSION: 1.99.0

  # Minimum Supported Rust Version
  MSRV: 1.89.0

  PYTHON_VERSION: "3.15"

jobs:
  lint_rust:
    name: Lint Rust
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 60
    env:
      # Tests always unwind: match it so dependencies are only checked once.
      CARGO_PROFILE_DEV_PANIC: unwind
    steps:
      - uses: actions/checkout@v7
        with:
          show-progress: false
          persist-credentials: false
      - name: Install rustfmt and clippy
        run: rustup toolchain install $RUST_VERSION --profile minimal --component rustfmt --component clippy
      - run: rustup override set $RUST_VERSION
        shell: bash
      - name: Cache rust cargo artifacts
        if: runner.environment == 'github-hosted'
        uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-bin: false
      - name: Run rustfmt
        run: cargo fmt --all -- --check
      - name: Run clippy
        run: scripts/clippy.sh
      - name: Check with only default features
        run: cargo check --all-targets

  cargo_deny:
    name: cargo deny
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-latest' }}
    # an advisory published overnight would turn the nightly red with nothing changed
    if: github.event_name != 'schedule'
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          show-progress: false
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25
        with:
          arguments: --workspace --all-features --locked
          command: check
          command-arguments: "-Dwarnings"

  docs:
    name: Rust doc comments
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 60
    env:
      RUSTDOCFLAGS: -Dwarnings
    steps:
      - uses: actions/checkout@v7
        with:
          show-progress: false
          persist-credentials: false
      - name: Cache rust cargo artifacts
        if: runner.environment == 'github-hosted'
        uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-bin: false
      - name: Rustdoc
        run: cargo doc --document-private-items --no-deps

  rust_tests:
    name: Rust tests
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            rust: latest
          - os: windows-latest
            rust: latest
          - os: macos-latest
            rust: latest

          # Minimum Supported Rust Version
          - os: ubuntu-latest
            rust: minimum
    runs-on: ${{ matrix.os == 'ubuntu-latest' && vars.LINUX_RUNNER_LARGE || matrix.os == 'macos-latest' && vars.MACOS_RUNNER || matrix.os == 'windows-latest' && (vars.WINDOWS_RUNNER || 'bb33-windows') || matrix.os }}
    timeout-minutes: 60
    steps:
      - run:
          echo "RUSTUP_TOOLCHAIN=$MSRV" >> $GITHUB_ENV
        shell: bash
        if: matrix.rust == 'minimum'
      - run:
          echo "RUSTUP_TOOLCHAIN=$RUST_VERSION" >> $GITHUB_ENV
        shell: bash
        if: matrix.rust == 'latest'

      - uses: actions/checkout@v7
        with:
          show-progress: false
          persist-credentials: false

      - name: Install Rust ${{ matrix.rust }}
        run: rustup toolchain install --profile minimal $RUSTUP_TOOLCHAIN
        shell: bash
      - run: rustup override set $RUSTUP_TOOLCHAIN
        shell: bash

      - name: Cache rust cargo artifacts
        if: runner.environment == 'github-hosted'
        uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-bin: false

      - name: Keep the build between jobs on bb33
        if: runner.environment == 'self-hosted'
        shell: bash
        run: '[ -z "$BB33_CARGO_TARGET_DIR" ] || echo "CARGO_TARGET_DIR=$BB33_CARGO_TARGET_DIR" >> "$GITHUB_ENV"'

      - name: Install nextest
        uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91
        with:
          tool: nextest

      - name: Tests
        env:
          RUST_BACKTRACE: 1
        run: cargo nextest run --workspace --exclude deltachat-jsonrpc-bindings --locked

      - name: Doc-Tests
        env:
          RUST_BACKTRACE: 1
        run: cargo test --workspace --exclude deltachat-jsonrpc-bindings --locked --doc

      - name: Test cargo vendor
        run: cargo vendor

  c_library:
    name: Build C library
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os == 'ubuntu-latest' && vars.LINUX_RUNNER_LARGE || matrix.os == 'macos-latest' && vars.MACOS_RUNNER || matrix.os }}
    timeout-minutes: 60
    # the sha256 of the library each leg on bb33 put into bb33's artifact cache
    outputs:
      ubuntu-latest: ${{ steps.bb33.outputs.ubuntu-latest }}
      macos-latest: ${{ steps.bb33.outputs.macos-latest }}
    steps:
      - uses: actions/checkout@v7
        with:
          show-progress: false
          persist-credentials: false

      - name: Cache rust cargo artifacts
        if: runner.environment == 'github-hosted'
        uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-bin: false

      - name: Build C library
        run: cargo build -p deltachat_ffi --locked

      # GitHub's artifacts come at about 0.5 MB/s to bb33; the jobs after this one on bb33
      # take the library from there, named and checked by the sha256 passed on as an output.
      # GitHub gets the artifact only off bb33 or when this fails, the upload took up to 37 s here.
      - name: Upload C library to bb33
        id: bb33
        if: runner.environment == 'self-hosted'
        continue-on-error: true
        env:
          OS: ${{ matrix.os }}
        run: |
          sha=$(shasum -a 256 target/debug/libdeltachat.a | cut -c1-64)
          curl -fsS --retry 2 -T target/debug/libdeltachat.a "http://10.33.0.16/artifacts/$sha"
          echo "$OS=$sha" >> "$GITHUB_OUTPUT"

      - name: Upload C library
        if: steps.bb33.outcome != 'success'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.os }}-libdeltachat.a
          path: target/debug/libdeltachat.a
          retention-days: 1

  rpc_server:
    name: Build deltachat-rpc-server
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os == 'ubuntu-latest' && vars.LINUX_RUNNER_LARGE || matrix.os == 'macos-latest' && vars.MACOS_RUNNER || matrix.os == 'windows-latest' && (vars.WINDOWS_RUNNER || 'bb33-windows') || matrix.os }}
    timeout-minutes: 60
    # the sha256 of the server each leg on bb33 put into bb33's artifact cache
    outputs:
      ubuntu-latest: ${{ steps.bb33.outputs.ubuntu-latest }}
      macos-latest: ${{ steps.bb33.outputs.macos-latest }}
      windows-latest: ${{ steps.bb33.outputs.windows-latest }}
    steps:
      - uses: actions/checkout@v7
        with:
          show-progress: false
          persist-credentials: false

      - name: Cache rust cargo artifacts
        if: runner.environment == 'github-hosted'
        uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-bin: false

      - name: Keep the build between jobs on bb33
        if: runner.environment == 'self-hosted'
        shell: bash
        run: '[ -z "$BB33_CARGO_TARGET_DIR" ] || echo "CARGO_TARGET_DIR=$BB33_CARGO_TARGET_DIR" >> "$GITHUB_ENV"'

      - name: Build deltachat-rpc-server
        run: cargo build -p deltachat-rpc-server --locked

      - name: Upload deltachat-rpc-server to bb33
        id: bb33
        if: runner.environment == 'self-hosted'
        continue-on-error: true
        env:
          OS: ${{ matrix.os }}
          EXE: ${{ matrix.os == 'windows-latest' && '.exe' || '' }}
          SUM: ${{ matrix.os == 'windows-latest' && 'sha256sum' || 'shasum -a 256' }}
        shell: bash
        run: |
          exe=${CARGO_TARGET_DIR:-target}/debug/deltachat-rpc-server$EXE
          sha=$($SUM "$exe" | cut -c1-64)
          curl -fsS --retry 2 -T "$exe" "http://10.33.0.16/artifacts/$sha"
          echo "$OS=$sha" >> "$GITHUB_OUTPUT"

      - name: Upload deltachat-rpc-server
        if: steps.bb33.outcome != 'success'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.os }}-deltachat-rpc-server
          path: ${{ env.CARGO_TARGET_DIR || 'target' }}/debug/deltachat-rpc-server${{ matrix.os == 'windows-latest' && '.exe' || '' }}
          retention-days: 1

  python_lint:
    name: Python lint
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          show-progress: false
          persist-credentials: false

      - name: Install tox
        run: pip install tox

      - name: Lint Python bindings
        working-directory: python
        run: tox -e lint

      - name: Lint deltachat-rpc-client
        working-directory: deltachat-rpc-client
        run: tox -e lint

  # mypy does not work with PyPy since mypy 1.19
  # as it introduced native `librt` dependency
  # that uses CPython internals.
  # We only run mypy with CPython because of this.
  cffi_python_mypy:
    name: CFFI Python mypy
    needs: ["c_library", "python_lint"]
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          show-progress: false
          persist-credentials: false

      - name: Download libdeltachat.a from bb33
        id: bb33
        if: runner.environment == 'self-hosted' && needs.c_library.outputs.ubuntu-latest
        continue-on-error: true
        env:
          SHA256: ${{ needs.c_library.outputs.ubuntu-latest }}
        run: |
          mkdir -p target/debug
          curl -fsS --retry 2 -o target/debug/libdeltachat.a "http://10.33.0.16/artifacts/$SHA256"
          echo "$SHA256  target/debug/libdeltachat.a" | shasum -a 256 -c

      - name: Download libdeltachat.a
        if: steps.bb33.outcome != 'success'
        uses: actions/download-artifact@v7
        with:
          name: ubuntu-latest-libdeltachat.a
          path: target/debug

      - name: Install tox
        run: pip install tox

      - name: Run mypy
        env:
          DCC_RS_TARGET: debug
          DCC_RS_DEV: ${{ github.workspace }}
        working-directory: python
        run: tox -e mypy


  cffi_python_tests:
    name: CFFI Python tests
    needs: ["c_library", "python_lint"]
    strategy:
      fail-fast: false
      matrix:
        include:
          # Currently used Python version.
          - os: ubuntu-latest
            python: latest
          - os: macos-latest
            python: latest

          # PyPy tests
          - os: ubuntu-latest
            python: pypy3.10
          - os: macos-latest
            python: pypy3.10

          # Minimum Supported Python Version = 3.10
          # This is the minimum version for which manylinux Python wheels are
          # built. Test it with minimum supported Rust version.
          - os: ubuntu-latest
            python: "3.10"

    runs-on: ${{ matrix.os == 'ubuntu-latest' && vars.LINUX_RUNNER || matrix.os == 'macos-latest' && vars.MACOS_RUNNER || matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          show-progress: false
          persist-credentials: false

      - name: Download libdeltachat.a from bb33
        id: bb33
        if: runner.environment == 'self-hosted' && needs.c_library.outputs[matrix.os]
        continue-on-error: true
        env:
          SHA256: ${{ needs.c_library.outputs[matrix.os] }}
        run: |
          mkdir -p target/debug
          curl -fsS --retry 2 -o target/debug/libdeltachat.a "http://10.33.0.16/artifacts/$SHA256"
          echo "$SHA256  target/debug/libdeltachat.a" | shasum -a 256 -c

      - name: Download libdeltachat.a
        if: steps.bb33.outcome != 'success'
        uses: actions/download-artifact@v7
        with:
          name: ${{ matrix.os }}-libdeltachat.a
          path: target/debug

      - name: Install python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.python == 'latest' && env.PYTHON_VERSION || matrix.python }}

      - name: Install tox
        run: pip install tox

      - name: Run python tests
        env:
          CHATMAIL_DOMAIN: ${{ runner.environment == 'self-hosted' && (github.event_name == 'schedule' && vars.NIGHTLY_CHATMAIL_DOMAIN || vars.LINUX_CHATMAIL_DOMAIN) || vars.CHATMAIL_DOMAIN }}
          DCC_RS_TARGET: debug
          DCC_RS_DEV: ${{ github.workspace }}
        working-directory: python
        run: tox -e doc,py

  rpc_python_tests:
    name: JSON-RPC Python tests
    needs: ["python_lint", "rpc_server"]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: latest
          - os: macos-latest
            python: latest
          - os: windows-latest
            python: latest

          # PyPy tests
          - os: ubuntu-latest
            python: pypy3.10
          - os: macos-latest
            python: pypy3.10

          # Minimum Supported Python Version = 3.10
          - os: ubuntu-latest
            python: "3.10"

    runs-on: ${{ matrix.os == 'ubuntu-latest' && vars.LINUX_RUNNER || matrix.os == 'macos-latest' && vars.MACOS_RUNNER || matrix.os == 'windows-latest' && (vars.WINDOWS_RUNNER || 'bb33-windows') || matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          show-progress: false
          persist-credentials: false

      - name: Install python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.python == 'latest' && env.PYTHON_VERSION || matrix.python }}

      - name: Install tox
        run: pip install tox

      - name: Download deltachat-rpc-server from bb33
        id: bb33
        if: runner.environment == 'self-hosted' && needs.rpc_server.outputs[matrix.os]
        continue-on-error: true
        env:
          SHA256: ${{ needs.rpc_server.outputs[matrix.os] }}
          EXE: ${{ matrix.os == 'windows-latest' && '.exe' || '' }}
          SUM: ${{ matrix.os == 'windows-latest' && 'sha256sum' || 'shasum -a 256' }}
        shell: bash
        run: |
          mkdir -p target/debug
          curl -fsS --retry 2 -o target/debug/deltachat-rpc-server$EXE "http://10.33.0.16/artifacts/$SHA256"
          echo "$SHA256  target/debug/deltachat-rpc-server$EXE" | $SUM -c

      - name: Download deltachat-rpc-server
        if: steps.bb33.outcome != 'success'
        uses: actions/download-artifact@v7
        with:
          name: ${{ matrix.os }}-deltachat-rpc-server
          path: target/debug

      - name: Make deltachat-rpc-server executable
        if: ${{ matrix.os != 'windows-latest' }}
        run: chmod +x target/debug/deltachat-rpc-server

      - name: Add deltachat-rpc-server to path
        if: ${{ matrix.os != 'windows-latest' }}
        run: echo ${{ github.workspace }}/target/debug >> $GITHUB_PATH

      - name: Add deltachat-rpc-server to path
        if: ${{ matrix.os == 'windows-latest' }}
        run: |
          "${{ github.workspace }}/target/debug" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Run deltachat-rpc-client tests
        env:
          CHATMAIL_DOMAIN: ${{ runner.environment == 'self-hosted' && (github.event_name == 'schedule' && vars.NIGHTLY_CHATMAIL_DOMAIN || vars.LINUX_CHATMAIL_DOMAIN) || vars.CHATMAIL_DOMAIN }}
        working-directory: deltachat-rpc-client
        run: tox -e py
